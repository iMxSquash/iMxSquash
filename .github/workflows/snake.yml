name: generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: iMxSquash
          outputs: |
            dist/github-snake.svg?color_snake=%2334c759&color_dots=%23e8e8ed,%23b3ebc4,%2380dba0,%234dcb85,%2334c759
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2330d158&color_dots=%23151517,%230f3d24,%231a5c35,%2324824a,%2330d158

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

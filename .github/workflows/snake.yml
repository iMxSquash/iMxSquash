name: generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: iMxSquash
          outputs: |
            dist/github-snake.svg?color_snake=%23007aff&color_dots=%23e8e8ed,%23b3d4ff,%2380b8ff,%234da3ff,%23007aff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%230a84ff&color_dots=%23151517,%230a2a4d,%23103d70,%23155a99,%230a84ff

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
